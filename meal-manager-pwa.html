// ─── Convert base64 data URL to Blob (for Telegram fix) ───
const dataURLtoBlob=(dataURL)=>{
  const arr=dataURL.split(",");
  const mime=arr[0].match(/:(.*?);/)[1];
  const bstr=atob(arr[1]);
  let n=bstr.length;
  const u8=new Uint8Array(n);
  while(n--)u8[n]=bstr.charCodeAt(n);
  return new Blob([u8],{type:mime});
};

  const isSpecialDay=(d)=>new Date(d+"T00:00:00").getDay()===specialWeekday;

  const getMemberDailyMeals=(id,d)=>{
    const meals=getMemberMealsOnDate(id,d);
    const guests=getGuestMealsOnDate(id,d);
    const rates=getMealRatesForDay(d);
    let t=0;
    if(meals.morning)t+=rates.morning*(1+(guests.morning||0));
    if(meals.lunch)  t+=rates.lunch  *(1+(guests.lunch  ||0));
    if(meals.dinner) t+=rates.dinner *(1+(guests.dinner ||0));

  // ── Telegram (FIXED: base64 → Blob → FormData) ──
  const sendReceiptToTelegram=async(file,receipt)=>{
    if(!tgToken||!tgChatId)return;

    try{
      const caption=`🧾 *বাজারের রশিদ*\n📅 ${fmtDate(receipt.date)}\n📝 ${receipt.note}\n🕐 ${new Date(receipt.uploadedAt).toLocaleString("bn-BD")}`;

      fd.append("chat_id",tgChatId);
      fd.append("caption",caption);
      fd.append("parse_mode","Markdown");
      fd.append("photo",file,"receipt.jpg");
      const res=await fetch(`https://api.telegram.org/bot${tgToken}/sendPhoto`,{method:"POST",body:fd});
      const data=await res.json();
      if(data.ok)notify("📱 টেলিগ্রামে পাঠানো হয়েছে!");

    setTgSending(false);
  };

  const resendToTelegram=async(receipt)=>{

      // Convert base64 image to Blob and send as FormData

      const fd=new FormData();
      fd.append("chat_id",tgChatId);
      fd.append("caption",caption);
      fd.append("parse_mode","Markdown");
      fd.append("photo",blob,"receipt.jpg");
      const res=await fetch(`https://api.telegram.org/bot${tgToken}/sendPhoto`,{method:"POST",body:fd});
      const data=await res.json();
      if(data.ok)notify("📱 টেলিগ্রামে পাঠানো হয়েছে!");

      notify("রশিদ সেভ হয়েছে");

    e.target.value="";
  };

  // ── AI Context ──
  const buildContext=useCallback(()=>{
    const mSummary=members.map(m=>{
      const meals=currentMonthDates.reduce((s,d)=>s+getMemberDailyMeals(m.id,d),0);
      const cost=meals*costPerMealUnit;
      const bal=getMemberBalance(m);
      return`${m.name}(রুম${m.room}):মিল=${meals.toFixed(1)},খরচ=৳${Math.round(cost)},জমা=৳${m.deposit},বকেয়া=৳${m.dueAmount||0},ব্যালেন্স=৳${Math.round(bal)}`;
    }).join("\n");
    const invSummary=inventory.map(i=>`${i.name}:${i.quantity}${i.unit}(সতর্কতা:${i.minAlert})`).join("\n");
    const recentGroc=allGroceries.slice(0,15).map(g=>`${fmtDate(g.date)}:${g.item} ৳${g.amount}`).join("\n");
    return`তুমি "${OWNER}"-এর মিল ম্যানেজার AI।
বাংলা বা যেকোনো ভাষায় উত্তর দাও।
Action format: [ACTION:{"type":"inventory_add","name":"তেল","amount":5,"unit":"লিটার"}]
বা [ACTION:{"type":"inventory_remove","name":"তেল","amount":2}]
বা [ACTION:{"type":"add_grocery","item":"চাল","amount":500,"date":"today"}]
=== লাইভ ডেটা ===
সদস্য:${members.length}জন|মিল রেট:৳${mealRate}/ইউনিট
মোট মিল:${totalMealsThisMonth.toFixed(1)}|বাজার:৳${Math.round(totalGroceriesThisMonth)}
হিসাবকৃত রেট:৳${calculatedMealRate.toFixed(2)}|হাতে:৳${Math.round(cashInHand)}
টিম ১ তহবিল:৳${team1CollectedFund}|টিম ২ তহবিল:৳${team2TotalFund}|সমন্বয়:৳${cashAdjustment}
=== সদস্য হিসাব ===
${mSummary}
=== ইনভেন্টরি ===
${invSummary}
=== বাজার (সাম্প্রতিক) ===
${recentGroc||"নেই"}
নিয়ম:সকাল=0.5,দুপুর=1.0(বিশেষ=2.5),রাত=1.0 ইউনিট।লক্ষ্যমাত্রা:৳${RATE_MIN}-৳${RATE_MAX}`;
  },[members,dailyRecords,groceries,mealRate,inventory,specialWeekday,cashAdjustment,team1CollectedFund,team2TotalFund]);

  const processAction=(actionStr)=>{
    try{
      const match=actionStr.match(/\[ACTION:(.*?)\]/);
      if(!match)return;
      const action=JSON.parse(match[1]);
      if(action.type==="inventory_add"){
        setInventory(prev=>prev.map(item=>{if(item.name.includes(action.name)||action.name.includes(item.name.split(" ")[0]))return{...item,quantity:item.quantity+action.amount};return item;}));
        notify(`✅ AI: ${action.name} +${action.amount}`);
      }else if(action.type==="inventory_remove"){
        setInventory(prev=>prev.map(item=>{if(item.name.includes(action.name)||action.name.includes(item.name.split(" ")[0]))return{...item,quantity:Math.max(0,item.quantity-action.amount)};return item;}));
        notify(`✅ AI: ${action.name} -${action.amount}`);
      }else if(action.type==="add_grocery"){
        const date=action.date==="today"?getTodayKey():action.date;
        setGroceries(prev=>({...prev,[date]:[...(prev[date]||[]),{id:genId(),item:action.item,amount:action.amount}]}));
        notify(`✅ AI: ${action.item} ৳${action.amount} বাজারে`);
      }
    }catch{}
  };

  const sendChat=async()=>{
    if(!chatInput.trim()||chatLoading)return;
    const userMsg=chatInput.trim();
    setChatInput("");
    const newMsgs=[...chatMessages,{role:"user",text:userMsg}];
    setChatMessages(newMsgs);
    setChatLoading(true);
    try{
      let reply="";
      if(aiProvider==="gemini"&&geminiKey){
        const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:buildContext()+"\n\nUser: "+userMsg}]}]})});
        const data=await res.json();
        if(data.error)reply=`⚠️ Gemini Error: ${data.error.message||data.error.status||JSON.stringify(data.error)}`;
        else reply=data.candidates?.[0]?.content?.parts?.[0]?.text||"Gemini: খালি উত্তর।";
      }else if(aiProvider==="openai"&&openaiKey){
        const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${openaiKey}`},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"system",content:buildContext()},...newMsgs.slice(1).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}))]})});
        const data=await res.json();
        if(data.error)reply=`⚠️ OpenAI Error: ${data.error.message||data.error.code||JSON.stringify(data.error)}`;
        else reply=data.choices?.[0]?.message?.content||"OpenAI: খালি উত্তর।";
      }else if(!geminiKey&&!openaiKey){
        reply="⚠️ API Key সেট করুন! সেটিং → 🤖 AI ট্যাবে যান। Gemini key বিনামূল্যে পাওয়া যায়: aistudio.google.com/apikey";
      }else{
        // Fallback: try Gemini if key exists even if provider mismatch
        if(geminiKey){
          const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:buildContext()+"\n\nUser: "+userMsg}]}]})});
          const data=await res.json();
          if(data.error)reply=`⚠️ Gemini Error: ${data.error.message}`;
          else reply=data.candidates?.[0]?.content?.parts?.[0]?.text||"খালি উত্তর।";
        }else{
          reply="⚠️ AI Key নেই। সেটিং → 🤖 AI ট্যাবে Gemini Key দিন (বিনামূল্যে)।";
        }
      }
      if(reply.includes("[ACTION:")){processAction(reply);reply=reply.replace(/\[ACTION:.*?\]/g,"").trim();}
      setChatMessages(prev=>[...prev,{role:"assistant",text:reply}]);
    }catch(err){
      setChatMessages(prev=>[...prev,{role:"assistant",text:`⚠️ Network Error: ${err.message||"অজানা সমস্যা"}। ইন্টারনেট সংযোগ চেক করুন।`}]);
    }
    setChatLoading(false);
  };

  const TABS=[

  ];

  // ── Daily meal stats for selected date ──
  const dayStats=useMemo(()=>{
    const rates=getMealRatesForDay(selectedDate);
    let morningCount=0,lunchCount=0,dinnerCount=0,morningMeals=0,lunchMeals=0,dinnerMeals=0;

          <div style={{fontSize:20}}>📱</div>

          <button onClick={()=>{installPromptRef.current?.prompt();setShowInstallBanner(false);}} style={{background:"#050d0f",border:"none",borderRadius:8,padding:"6px 14px",color:C.primary,cursor:"pointer",fontSize:12,fontFamily:"inherit",fontWeight:700}}>ইনস্টল</button>

        </div>
      )}

      {/* Toast */}
      {notification&&(
        <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:10000,background:notification.type==="error"?"#ef4444":C.primary,color:notification.type==="error"?"#fff":"#050d0f",padding:"11px 26px",borderRadius:14,fontWeight:700,boxShadow:"0 4px 32px #000b",maxWidth:"92vw",textAlign:"center",fontSize:14}}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>

              <div style={{fontSize:10,color:C.muted}}>{today.getDate()} {MONTHS_BN[today.getMonth()]} {today.getFullYear()} · {members.length} সদস্য · by {OWNER}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:9,color:C.muted}}>মিল রেট</div>
                <div style={{fontSize:18,fontWeight:700,color:rs?.type==="high"?C.danger:rs?.type==="ok"?C.success:C.accent}}>৳{calculatedMealRate.toFixed(1)}</div>

// ══ SIMPLE HASH (for password storage) ══
const simpleHash=(str)=>{let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return h.toString(36);};

// ══ LOGIN COMPONENT ══
function LoginScreen({onLogin,savedAuth}){
  const isSetup=!savedAuth?.userId;
  const[userId,setUserId]=React.useState("");
  const[password,setPassword]=React.useState("");
  const[confirmPass,setConfirmPass]=React.useState("");
  const[showPass,setShowPass]=React.useState(false);
  const[error,setError]=React.useState("");
  const[attempts,setAttempts]=React.useState(()=>{try{return parseInt(localStorage.getItem("mm_attempts")||"0");}catch{return 0;}});
  const[lockUntil,setLockUntil]=React.useState(()=>{try{return parseInt(localStorage.getItem("mm_lock")||"0");}catch{return 0;}});
  const[now,setNow]=React.useState(Date.now());

  React.useEffect(()=>{
    const t=setInterval(()=>setNow(Date.now()),1000);
    return()=>clearInterval(t);
  },[]);

  const isLocked=lockUntil>now;
  const lockSecsLeft=Math.ceil((lockUntil-now)/1000);

  const handleSetup=()=>{
    if(!userId.trim()||userId.trim().length<3)return setError("ID কমপক্ষে ৩ অক্ষর হতে হবে");
    if(!password||password.length<4)return setError("পাসওয়ার্ড কমপক্ষে ৪ অক্ষর হতে হবে");
    if(password!==confirmPass)return setError("পাসওয়ার্ড মিলছে না");
    const auth={userId:userId.trim(),passHash:simpleHash(password)};
    localStorage.setItem("mm_auth",JSON.stringify(auth));
    onLogin(auth);
  };

  const handleLogin=()=>{
    if(isLocked)return;
    if(!userId.trim()||!password)return setError("ID ও পাসওয়ার্ড দিন");
    if(userId.trim()!==savedAuth.userId){setError("ভুল User ID");return;}
    if(simpleHash(password)!==savedAuth.passHash){
      const newAttempts=attempts+1;
      setAttempts(newAttempts);
      localStorage.setItem("mm_attempts",newAttempts.toString());
      if(newAttempts>=4){
        const until=Date.now()+180000;
        setLockUntil(until);
        localStorage.setItem("mm_lock",until.toString());
        setError("৪ বার ভুল! ১৮০ সেকেন্ড লক করা হয়েছে 🔒");
      }else{
        setError(`ভুল পাসওয়ার্ড! আর ${4-newAttempts} বার সুযোগ আছে`);
      }
      return;
    }
    localStorage.setItem("mm_attempts","0");
    localStorage.removeItem("mm_lock");
    onLogin(savedAuth);
  };

  return(
    <div style={{minHeight:"100vh",background:"#060d0f",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"'Hind Siliguri',sans-serif"}}>
      <div style={{width:"100%",maxWidth:380}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:56,marginBottom:10}}>🏠</div>
          <div style={{fontSize:22,fontWeight:700,color:"#00c9a7"}}>মিল ম্যানেজার Pro</div>
          <div style={{fontSize:12,color:"#4a6572",marginTop:4}}>by {OWNER}</div>
        </div>

        {/* Card */}
        <div style={{background:"#112028",borderRadius:18,padding:24,border:"1px solid #1a3540",boxShadow:"0 8px 48px #000a"}}>
          <div style={{fontSize:16,fontWeight:700,color:"#00c9a7",marginBottom:20,textAlign:"center"}}>
            {isSetup?"🔐 প্রথমবার সেটআপ করুন":"🔑 লগইন করুন"}
          </div>

          {isLocked?(
            <div style={{textAlign:"center",padding:20}}>
              <div style={{fontSize:48,marginBottom:12}}>🔒</div>
              <div style={{fontSize:16,fontWeight:700,color:"#ef4444",marginBottom:8}}>লক হয়ে গেছে!</div>
              <div style={{fontSize:28,fontWeight:700,color:"#f59e0b"}}>{lockSecsLeft} সেকেন্ড</div>
              <div style={{fontSize:12,color:"#4a6572",marginTop:8}}>পরে আবার চেষ্টা করুন</div>
            </div>
          ):(
            <>
              {/* User ID */}
              <div style={{marginBottom:14}}>
                <div style={{fontSize:11,color:"#4a6572",marginBottom:5}}>👤 User ID</div>
                <input value={userId} onChange={e=>{setUserId(e.target.value);setError("");}} placeholder="আপনার ID লিখুন" onKeyDown={e=>e.key==="Enter"&&(isSetup?handleSetup():handleLogin())}
                  style={{width:"100%",background:"#0c1a1f",border:"1px solid #1a3540",color:"#d4e8ee",borderRadius:10,padding:"11px 14px",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
              </div>

              {/* Password */}
              <div style={{marginBottom:isSetup?14:20}}>
                <div style={{fontSize:11,color:"#4a6572",marginBottom:5}}>🔑 পাসওয়ার্ড</div>
                <div style={{position:"relative"}}>
                  <input type={showPass?"text":"password"} value={password} onChange={e=>{setPassword(e.target.value);setError("");}} placeholder="পাসওয়ার্ড" onKeyDown={e=>e.key==="Enter"&&(isSetup?handleSetup():handleLogin())}
                    style={{width:"100%",background:"#0c1a1f",border:"1px solid #1a3540",color:"#d4e8ee",borderRadius:10,padding:"11px 40px 11px 14px",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
                  <button onClick={()=>setShowPass(p=>!p)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#4a6572",cursor:"pointer",fontSize:16}}>{showPass?"🙈":"👁️"}</button>
                </div>
              </div>

              {/* Confirm Password (setup only) */}
              {isSetup&&(
                <div style={{marginBottom:20}}>
                  <div style={{fontSize:11,color:"#4a6572",marginBottom:5}}>🔑 পাসওয়ার্ড নিশ্চিত করুন</div>
                  <input type={showPass?"text":"password"} value={confirmPass} onChange={e=>{setConfirmPass(e.target.value);setError("");}} placeholder="আবার লিখুন"
                    style={{width:"100%",background:"#0c1a1f",border:"1px solid #1a3540",color:"#d4e8ee",borderRadius:10,padding:"11px 14px",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}}/>
                </div>
              )}

              {/* Error */}
              {error&&<div style={{background:"#ef444422",border:"1px solid #ef4444",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#ef4444",marginBottom:14,textAlign:"center"}}>{error}</div>}

              {/* Attempt indicator */}
              {!isSetup&&attempts>0&&!isLocked&&(
                <div style={{display:"flex",gap:5,justifyContent:"center",marginBottom:14}}>
                  {[1,2,3,4].map(i=><div key={i} style={{width:10,height:10,borderRadius:"50%",background:i<=attempts?"#ef4444":"#1a3540"}}/>)}
                  <div style={{fontSize:11,color:"#ef4444",marginLeft:6}}>{attempts}/4 ভুল</div>
                </div>
              )}

              {/* Submit Button */}
              <button onClick={isSetup?handleSetup:handleLogin}
                style={{width:"100%",background:"linear-gradient(135deg,#00c9a7,#0ea5e9)",border:"none",borderRadius:12,padding:"13px",color:"#050d0f",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>
                {isSetup?"✓ সেটআপ সম্পন্ন করুন":"🔓 লগইন"}
              </button>

              {/* Reset option */}
              {!isSetup&&(
                <div style={{textAlign:"center",marginTop:14}}>
                  <button onClick={()=>{if(window.confirm("সব ডেটা মুছে নতুন সেটআপ করবেন? এটা আর ফেরানো যাবে না!")){localStorage.clear();window.location.reload();}}}
                    style={{background:"none",border:"none",color:"#4a6572",cursor:"pointer",fontSize:11,fontFamily:"inherit",textDecoration:"underline"}}>
                    পাসওয়ার্ড ভুলে গেছেন? (রিসেট)
                  </button>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ══ localStorage persistence ══
const STORAGE_KEY="meal_mgr_v4";
function AppWithStorage(){
  const[loaded,setLoaded]=React.useState(false);
  const[savedState,setSavedState]=React.useState(null);
  const[auth,setAuth]=React.useState(null);
  const[savedAuth,setSavedAuth]=React.useState(null);
  const[loggedIn,setLoggedIn]=React.useState(false);

  React.useEffect(()=>{
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw)setSavedState(JSON.parse(raw));
      const rawAuth=localStorage.getItem("mm_auth");
      if(rawAuth)setSavedAuth(JSON.parse(rawAuth));
    }catch{}
    setLoaded(true);
  },[]);

  if(!loaded)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060d0f",color:"#00c9a7",fontFamily:"Hind Siliguri",flexDirection:"column",gap:14}}>
      <div style={{fontSize:40}}>🏠</div>
      <div style={{fontSize:18,fontWeight:700}}>মিল ম্যানেজার Pro</div>
      <div style={{fontSize:12,color:"#4a6572"}}>লোড হচ্ছে...</div>
    </div>
  );

  if(!loggedIn)return<LoginScreen savedAuth={savedAuth} onLogin={(a)=>{setAuth(a);setSavedAuth(a);setLoggedIn(true);}}/>;

  return<MealManagerPro initialSavedState={savedState} onSave={(state)=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{}}} onLogout={()=>setLoggedIn(false)}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<AppWithStorage/>);
</script>

if("serviceWorker" in navigator){
  const swCode=`
    const CACHE="meal-mgr-v4";
    self.addEventListener("install",e=>{self.skipWaiting();});
    self.addEventListener("activate",e=>{e.waitUntil(clients.claim());});
    self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});
  `;
  const blob=new Blob([swCode],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
