  <script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ══════════════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════════════
const DAYS_BN = ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"];
const MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const MEAL_RATES = { morning: 0.5, lunch: 1, dinner: 1 };
const SPECIAL_LUNCH = 2.5;
const OWNER = "Shaishab Abedin";
const MEAL_RATE_WARNING_MIN = 36;
const MEAL_RATE_WARNING_MAX = 39;

// ══ Color Palette — Deep Teal / Emerald Professional ══
const C = {
  bg:        "#060d0f",
  surface:   "#0c1a1f",
  card:      "#112028",
  border:    "#1a3540",
  borderHi:  "#24505f",
  primary:   "#00c9a7",   // teal-mint
  secondary: "#0ea5e9",   // sky-blue
  accent:    "#f59e0b",   // amber
  danger:    "#ef4444",
  success:   "#10b981",
  warn:      "#f59e0b",
  muted:     "#4a6572",
  text:      "#d4e8ee",
  textDim:   "#5e8494",
  glow:      "rgba(0,201,167,0.18)",
};

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
const getTodayKey = () => new Date().toISOString().split("T")[0];
const getMonthDates = (y, m) => {
  const dates = [], days = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= days; d++) dates.push(`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  return dates;
};
const fmtDate = (d) => { const dt = new Date(d + "T00:00:00"); return `${dt.getDate()} ${MONTHS_BN[dt.getMonth()]}`; };
const genId = () => Date.now() + Math.random();

const initialMembers = Array.from({ length: 40 }, (_, i) => ({
  id: i + 1, name: `সদস্য ${i + 1}`, room: `${i + 1}`,
  activeMeals: { morning: true, lunch: true, dinner: true },
  deposit: 0, depositHistory: [],
}));

const DEFAULT_INVENTORY = [
  { id: 1, name: "তেল (সয়াবিন)", unit: "লিটার", quantity: 0, minAlert: 2 },
  { id: 2, name: "লবণ", unit: "কেজি", quantity: 0, minAlert: 0.5 },
  { id: 3, name: "চাল", unit: "কেজি", quantity: 0, minAlert: 5 },
  { id: 4, name: "ডাল", unit: "কেজি", quantity: 0, minAlert: 1 },
  { id: 5, name: "পেঁয়াজ", unit: "কেজি", quantity: 0, minAlert: 2 },
  { id: 6, name: "রসুন", unit: "কেজি", quantity: 0, minAlert: 0.5 },
  { id: 7, name: "আদা", unit: "কেজি", quantity: 0, minAlert: 0.2 },
  { id: 8, name: "হলুদ গুঁড়া", unit: "গ্রাম", quantity: 0, minAlert: 100 },
  { id: 9, name: "মরিচ গুঁড়া", unit: "গ্রাম", quantity: 0, minAlert: 100 },
  { id: 10, name: "গ্যাস (সিলিন্ডার)", unit: "পিস", quantity: 0, minAlert: 1 },
];

// Chat suggestion prompts
const CHAT_SUGGESTIONS = [
  "তেল ৫ লিটার কিনলাম",
  "কার কত বকেয়া?",
  "মিল রেট কত?",
  "হাতে কত টাকা?",
  "সবার হিসাব দাও",
  "কম মজুদ কী কী?",
  "এই সপ্তাহে কত খরচ?",
];

// ══════════════════════════════════════════════════════════════
//  MAIN COMPONENT
// ══════════════════════════════════════════════════════════════
function MealManagerPro({ initialSavedState, onSave }) {
  // ── Helper to load saved state or use default ──
  const ls = (key, def) => {
    try { return initialSavedState?.[key] ?? def; } catch { return def; }
  };
  const [tab, setTab] = useState("dashboard");
  const [members, setMembers] = useState(() => ls("members", initialMembers));
  const [dailyRecords, setDailyRecords] = useState(() => ls("dailyRecords", {}));
  const [groceries, setGroceries] = useState(() => ls("groceries", {}));
  const [mealRate, setMealRate] = useState(() => ls("mealRate", 0));
  const [selectedDate, setSelectedDate] = useState(getTodayKey());
  const [specialWeekday, setSpecialWeekday] = useState(() => ls("specialWeekday", 5));
  const [specialDistrib, setSpecialDistrib] = useState(() => ls("specialDistrib", {}));
  const [editingMember, setEditingMember] = useState(null);
  const [depositInput, setDepositInput] = useState({});
  const [newMemberName, setNewMemberName] = useState("");
  const [newMemberRoom, setNewMemberRoom] = useState("");
  const [rateInput, setRateInput] = useState(() => ls("rateInput", 0));
  const [notification, setNotification] = useState(null);

  const [grocItem, setGrocItem] = useState("");
  const [grocAmt, setGrocAmt] = useState("");
  const [grocDate, setGrocDate] = useState(getTodayKey());

  const [inventory, setInventory] = useState(() => ls("inventory", DEFAULT_INVENTORY));
  const [invName, setInvName] = useState("");
  const [invUnit, setInvUnit] = useState("");
  const [invQty, setInvQty] = useState("");
  const [invMin, setInvMin] = useState("");
  const [invAdjId, setInvAdjId] = useState(null);
  const [invAdjAmt, setInvAdjAmt] = useState("");
  const [invAdjType, setInvAdjType] = useState("add");
  const [showAddInvForm, setShowAddInvForm] = useState(false);

  const [receipts, setReceipts] = useState(() => ls("receipts", []));
  const [receiptDate, setReceiptDate] = useState(getTodayKey());
  const [receiptNote, setReceiptNote] = useState("");
  const [viewReceipt, setViewReceipt] = useState(null);
  const receiptInputRef = useRef(null);

  // Telegram Bot settings
  const [telegramBotToken, setTelegramBotToken] = useState(() => ls("telegramBotToken", ""));
  const [telegramChatId, setTelegramChatId] = useState(() => ls("telegramChatId", ""));
  const [telegramSending, setTelegramSending] = useState(false);
  const [showTgKeys, setShowTgKeys] = useState(false);

  const [sdRoom, setSdRoom] = useState("");
  const [sdCount, setSdCount] = useState("");
  const [sdCollector, setSdCollector] = useState("");
  const [sdDate, setSdDate] = useState(getTodayKey());

  const [guestMeals, setGuestMeals] = useState(() => ls("guestMeals", {}));

  const [chatOpen, setChatOpen] = useState(false);
  const [chatMessages, setChatMessages] = useState([{
    role: "assistant",
    text: `আস্সালামু আলাইকুম! আমি ${OWNER}-এর মিল ম্যানেজার AI সহকারী। 🤖\n\n━━━ আমি যা করতে পারি ━━━\n• ইনভেন্টরি আপডেট: "তেল ৫ লিটার কিনলাম"\n• হিসাব জিজ্ঞেস: "এই মাসে কার কত বকেয়া?"\n• মিল নিয়ন্ত্রণ: "রহিমের সকালের মিল বন্ধ কর"\n• বিশ্লেষণ: "মিল রেট কত হওয়া উচিত?"\n• যেকোনো ভাষায় কথা বলুন ✓\n\n⚠️ সতর্কতা: AI তথ্য ভুল হতে পারে। গুরুত্বপূর্ণ হিসাব নিজে যাচাই করুন।`
  }]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [showChatGuide, setShowChatGuide] = useState(false);

  // ── Smart Calculator state ────────────────────────────────
  const [calcDisplay, setCalcDisplay] = useState("0");
  const [calcExpression, setCalcExpression] = useState("");
  const [calcHistory, setCalcHistory] = useState(() => ls("calcHistory", []));
  const [calcMode, setCalcMode] = useState("basic"); // basic | scientific | meal | split | emi | gst
  const [calcSplitTotal, setCalcSplitTotal] = useState("");
  const [calcSplitPeople, setCalcSplitPeople] = useState("");
  const [calcMealUnits, setCalcMealUnits] = useState("");
  const [calcMealRateInput, setCalcMealRateInput] = useState("");
  const [calcWaiting, setCalcWaiting] = useState(false); // waiting for next operand
  // EMI calculator state
  const [emiPrincipal, setEmiPrincipal] = useState("");
  const [emiRate, setEmiRate] = useState("");
  const [emiMonths, setEmiMonths] = useState("");
  // GST/VAT calculator state
  const [gstAmount, setGstAmount] = useState("");
  const [gstRate, setGstRate] = useState("15");
  const [gstMode, setGstMode] = useState("add"); // add | remove

  const [settingsTab, setSettingsTab] = useState("general");
  const [aiProvider, setAiProvider] = useState(() => ls("aiProvider", "claude"));
  const [geminiKey, setGeminiKey] = useState(() => ls("geminiKey", ""));
  const [openaiKey, setOpenaiKey] = useState(() => ls("openaiKey", ""));
  const [showKeys, setShowKeys] = useState(false);
  const [aiTestStatus, setAiTestStatus] = useState({}); // {gemini: "ok"|"fail"|"testing", openai: ...}
  const [aiTestMsg, setAiTestMsg] = useState({});

  const chatEndRef = useRef(null);
  const installPromptRef = useRef(null);
  const [showInstallBanner, setShowInstallBanner] = React.useState(false);

  // ── PWA Install prompt ────────────────────────────────────
  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      installPromptRef.current = e;
      setShowInstallBanner(true);
    };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);
  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);

  // ── Auto-save to localStorage ─────────────────────────────
  useEffect(() => {
    const state = {
      members, dailyRecords, groceries, mealRate, specialWeekday,
      specialDistrib, rateInput, inventory, receipts, guestMeals,
      telegramBotToken, telegramChatId, aiProvider, geminiKey, openaiKey,
      calcHistory,
    };
    onSave && onSave(state);
  }, [members, dailyRecords, groceries, mealRate, specialWeekday,
      specialDistrib, rateInput, inventory, receipts, guestMeals,
      telegramBotToken, telegramChatId, aiProvider, geminiKey, openaiKey,
      calcHistory]);

  // ── Notification ──────────────────────────────────────────
  const notify = (msg, type = "success") => {
    setNotification({ msg, type });
    setTimeout(() => setNotification(null), 3500);
  };

  // ── Date/Meal helpers ─────────────────────────────────────
  const isSpecialDay = (d) => new Date(d + "T00:00:00").getDay() === specialWeekday;
  const getMealValueForDay = (d) => ({ morning: MEAL_RATES.morning, lunch: isSpecialDay(d) ? SPECIAL_LUNCH : MEAL_RATES.lunch, dinner: MEAL_RATES.dinner });

  const getMemberMealsOnDate = (id, d) => {
    const rec = dailyRecords[d];
    if (rec && rec[id] !== undefined) return rec[id];
    const m = members.find(x => x.id === id);
    return m ? { ...m.activeMeals } : { morning: true, lunch: true, dinner: true };
  };
  const getGuestMealsOnDate = (id, d) => guestMeals[d]?.[id] || { morning: 0, lunch: 0, dinner: 0 };
  const setGuestMealCount = (id, d, mealKey, delta) => {
    setGuestMeals(prev => {
      const dayData = prev[d] || {};
      const memberData = dayData[id] || { morning: 0, lunch: 0, dinner: 0 };
      const newVal = Math.max(0, (memberData[mealKey] || 0) + delta);
      return { ...prev, [d]: { ...dayData, [id]: { ...memberData, [mealKey]: newVal } } };
    });
  };
  const getMemberDailyMeals = (id, d) => {
    const meals = getMemberMealsOnDate(id, d);
    const guests = getGuestMealsOnDate(id, d);
    const rates = getMealValueForDay(d);
    let t = 0;
    if (meals.morning) t += rates.morning + rates.morning * (guests.morning || 0);
    if (meals.lunch)   t += rates.lunch   + rates.lunch   * (guests.lunch   || 0);
    if (meals.dinner)  t += rates.dinner  + rates.dinner  * (guests.dinner  || 0);
    return t;
  };

  const today = new Date();
  const currentMonthDates = getMonthDates(today.getFullYear(), today.getMonth());

  const totalMealsThisMonth = useMemo(() =>
    currentMonthDates.reduce((s, d) => s + members.reduce((ms, m) => ms + getMemberDailyMeals(m.id, d), 0), 0),
    [members, dailyRecords, specialWeekday]
  );
  const totalGroceriesThisMonth = useMemo(() =>
    currentMonthDates.reduce((sum, d) => sum + (groceries[d] || []).reduce((s, i) => s + i.amount, 0), 0),
    [groceries]
  );
  const totalCostThisMonth = totalMealsThisMonth * mealRate + totalGroceriesThisMonth;
  const costPerMealUnit = totalMealsThisMonth > 0 ? totalCostThisMonth / totalMealsThisMonth : 0;
  const totalDeposit = members.reduce((s, m) => s + m.deposit, 0);
  const cashInHand = totalDeposit - totalCostThisMonth;
  const calculatedMealRate = totalMealsThisMonth > 0 ? totalGroceriesThisMonth / totalMealsThisMonth : 0;

  const getMemberMonthCost = (id) =>
    currentMonthDates.reduce((s, d) => s + getMemberDailyMeals(id, d), 0) * costPerMealUnit;

  const allGroceries = useMemo(() => {
    const list = [];
    Object.entries(groceries).forEach(([date, items]) => items.forEach(item => list.push({ ...item, date })));
    return list.sort((a, b) => b.date.localeCompare(a.date));
  }, [groceries]);

  const mealRateStatus = () => {
    if (calculatedMealRate === 0) return null;
    if (calculatedMealRate < MEAL_RATE_WARNING_MIN) return { type: "low", msg: `মিল রেট ৳${calculatedMealRate.toFixed(2)} — কম আছে (লক্ষ্য ৳${MEAL_RATE_WARNING_MIN}-৳${MEAL_RATE_WARNING_MAX})` };
    if (calculatedMealRate > MEAL_RATE_WARNING_MAX) return { type: "high", msg: `⚠️ মিল রেট ৳${calculatedMealRate.toFixed(2)} — বেশি হয়ে গেছে!` };
    return { type: "ok", msg: `✅ মিল রেট ৳${calculatedMealRate.toFixed(2)} — লক্ষ্যমাত্রার মধ্যে` };
  };

  const toggleMealOnDate = (id, meal) => {
    const current = getMemberMealsOnDate(id, selectedDate);
    setDailyRecords(prev => ({ ...prev, [selectedDate]: { ...(prev[selectedDate] || {}), [id]: { ...current, [meal]: !current[meal] } } }));
  };
  const toggleDefaultMeal = (id, meal) =>
    setMembers(prev => prev.map(m => m.id === id ? { ...m, activeMeals: { ...m.activeMeals, [meal]: !m.activeMeals[meal] } } : m));

  const addDeposit = (id) => {
    const amt = parseFloat(depositInput[id]);
    if (!amt || amt <= 0) return notify("সঠিক পরিমাণ দিন", "error");
    setMembers(prev => prev.map(m => m.id === id ? { ...m, deposit: m.deposit + amt, depositHistory: [...(m.depositHistory || []), { date: getTodayKey(), amount: amt }] } : m));
    setDepositInput(prev => ({ ...prev, [id]: "" }));
    notify(`৳${amt} জমা হয়েছে`);
  };

  const addGrocery = () => {
    if (!grocItem.trim()) return notify("আইটেমের নাম দিন", "error");
    const amt = parseFloat(grocAmt);
    if (!amt || amt <= 0) return notify("সঠিক মূল্য দিন", "error");
    setGroceries(prev => ({ ...prev, [grocDate]: [...(prev[grocDate] || []), { id: genId(), item: grocItem.trim(), amount: amt }] }));
    setGrocItem(""); setGrocAmt("");
    notify(`${grocItem} (৳${amt}) যোগ হয়েছে`);
  };
  const removeGrocery = (date, id) =>
    setGroceries(prev => ({ ...prev, [date]: (prev[date] || []).filter(g => g.id !== id) }));

  const addMember = () => {
    if (!newMemberName.trim()) return notify("নাম দিন", "error");
    setMembers(p => [...p, {
      id: Math.max(...p.map(x => x.id), 0) + 1,
      name: newMemberName.trim(), room: newMemberRoom.trim() || `${Math.max(...p.map(x=>x.id),0)+1}`,
      activeMeals: { morning: true, lunch: true, dinner: true }, deposit: 0, depositHistory: []
    }]);
    setNewMemberName(""); setNewMemberRoom("");
    notify("নতুন সদস্য যোগ হয়েছে");
  };

  const saveRate = () => { setMealRate(rateInput); notify("মিল রেট আপডেট হয়েছে"); };

  // ── Smart Calculator Logic ────────────────────────────────
  const calcInput = (val) => {
    if (calcWaiting) {
      setCalcDisplay(String(val));
      setCalcWaiting(false);
      return;
    }
    setCalcDisplay(prev => {
      if (prev === "0" && val !== ".") return String(val);
      if (val === "." && prev.includes(".")) return prev;
      return prev + val;
    });
  };

  const calcOp = (op) => {
    setCalcExpression(calcDisplay + " " + op);
    setCalcWaiting(true);
  };

  const calcPercent = () => {
    const v = parseFloat(calcDisplay);
    if (!isNaN(v)) {
      setCalcDisplay(String(v / 100));
    }
  };

  const calcEval = () => {
    try {
      const parts = calcExpression.trim().split(" ");
      const left = parseFloat(parts[0]);
      const op = parts[1];
      const right = parseFloat(calcDisplay);
      let result;
      if (op === "+") result = left + right;
      else if (op === "−") result = left - right;
      else if (op === "×") result = left * right;
      else if (op === "÷") {
        if (right === 0) { setCalcDisplay("Error"); setCalcExpression(""); return; }
        result = left / right;
      } else return;
      const formatted = parseFloat(result.toFixed(6)).toString();
      const entry = `${calcExpression} ${right} = ${formatted}`;
      setCalcHistory(h => [entry, ...h].slice(0, 20));
      setCalcDisplay(formatted);
      setCalcExpression("");
      setCalcWaiting(false);
    } catch {
      setCalcDisplay("Error");
    }
  };

  const calcClear = () => { setCalcDisplay("0"); setCalcExpression(""); setCalcWaiting(false); };
  const calcBackspace = () => {
    setCalcDisplay(prev => prev.length > 1 ? prev.slice(0, -1) : "0");
  };
  const calcToggleSign = () => {
    setCalcDisplay(prev => prev.startsWith("-") ? prev.slice(1) : "-" + prev);
  };

  // Scientific functions
  const calcScientific = (fn) => {
    const v = parseFloat(calcDisplay);
    if (isNaN(v)) return;
    let result;
    try {
      if (fn === "sqrt") result = Math.sqrt(v);
      else if (fn === "sq") result = v * v;
      else if (fn === "cube") result = v * v * v;
      else if (fn === "inv") { if (v === 0) { setCalcDisplay("Error"); return; } result = 1 / v; }
      else if (fn === "sin") result = Math.sin((v * Math.PI) / 180);
      else if (fn === "cos") result = Math.cos((v * Math.PI) / 180);
      else if (fn === "tan") result = Math.tan((v * Math.PI) / 180);
      else if (fn === "log") { if (v <= 0) { setCalcDisplay("Error"); return; } result = Math.log10(v); }
      else if (fn === "ln") { if (v <= 0) { setCalcDisplay("Error"); return; } result = Math.log(v); }
      else if (fn === "pi") { setCalcDisplay(String(Math.PI.toFixed(8))); return; }
      else if (fn === "e") { setCalcDisplay(String(Math.E.toFixed(8))); return; }
      else if (fn === "fact") {
        if (v < 0 || !Number.isInteger(v) || v > 20) { setCalcDisplay("Error"); return; }
        result = Array.from({length: v}, (_, i) => i + 1).reduce((a, b) => a * b, 1);
      }
      const formatted = parseFloat(result.toFixed(8)).toString();
      const entry = `${fn}(${v}) = ${formatted}`;
      setCalcHistory(h => [entry, ...h].slice(0, 20));
      setCalcDisplay(formatted);
      setCalcWaiting(false);
    } catch { setCalcDisplay("Error"); }
  };

  // EMI calculation
  const calcEMI = () => {
    const P = parseFloat(emiPrincipal);
    const r = parseFloat(emiRate) / 100 / 12;
    const n = parseInt(emiMonths);
    if (!P || !r || !n || isNaN(P) || isNaN(r) || isNaN(n)) return null;
    const emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
    const totalPay = emi * n;
    const totalInterest = totalPay - P;
    return { emi: emi.toFixed(2), totalPay: totalPay.toFixed(2), totalInterest: totalInterest.toFixed(2) };
  };

  // GST/VAT calculation
  const calcGST = () => {
    const amt = parseFloat(gstAmount);
    const rate = parseFloat(gstRate) / 100;
    if (!amt || isNaN(amt) || isNaN(rate)) return null;
    if (gstMode === "add") {
      const tax = amt * rate;
      return { original: amt.toFixed(2), tax: tax.toFixed(2), total: (amt + tax).toFixed(2) };
    } else {
      const original = amt / (1 + rate);
      const tax = amt - original;
      return { original: original.toFixed(2), tax: tax.toFixed(2), total: amt.toFixed(2) };

            return { ...item, quantity: item.quantity + action.amount };
          }
          return item;
        }));
        notify(`✅ AI: ${action.name} +${action.amount} ${action.unit}`);
      } else if (action.type === "inventory_remove") {
        setInventory(prev => prev.map(item => {

            return { ...item, quantity: Math.max(0, item.quantity - action.amount) };

    // ══ localStorage persistence ══
    const STORAGE_KEY = "meal_manager_pro_v3";

    function AppWithStorage() {
      const [loaded, setLoaded] = React.useState(false);
      const [savedState, setSavedState] = React.useState(null);

      React.useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) setSavedState(JSON.parse(raw));
        } catch(e) {}
        setLoaded(true);
      }, []);

      if (!loaded) return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060d0f",color:"#00c9a7",fontFamily:"Hind Siliguri",flexDirection:"column",gap:16}}>
          <div style={{fontSize:40}}>🏠</div>
          <div style={{fontSize:18,fontWeight:700}}>মিল ম্যানেজার Pro</div>
          <div style={{fontSize:13,color:"#4a6572"}}>লোড হচ্ছে...</div>
        </div>
      );

      return <MealManagerPro initialSavedState={savedState} onSave={(state) => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
      }} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppWithStorage />);
  </script>

  <!-- Service Worker for offline PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      const swCode = `
        const CACHE = "meal-mgr-v3";
        const START_URL = "/Meal-Manager-v2/meal-manager-pwa.html";
        self.addEventListener("install", e => {
          self.skipWaiting();
          e.waitUntil(caches.open(CACHE).then(c => c.addAll([START_URL])));
        });
        self.addEventListener("activate", e => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener("fetch", e => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request) || caches.match(START_URL))
          );
        });
      `;
      const blob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
